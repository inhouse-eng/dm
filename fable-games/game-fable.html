<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창공 편대</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one arcade cabinet column. Marquee (score, lives) on top, CRT playfield, control strip below. */
  --cab:#111b36;      /* cabinet body */
  --bezel:#050914;    /* screen surround */
  --ink:#f6f0d8;      /* warm phosphor white */
  --marquee:#ffc93c;  /* coin-op yellow */
  --alert:#ff5347;    /* hit and warning red */
  --sea:#2f7fd8;      /* echo of the playfield blue */
  --font-display:"Press Start 2P","Do Hyeon",ui-monospace,Menlo,Consolas,monospace;
  --font-body:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --u:2px;            /* one game pixel on screen, set by script */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--cab) radial-gradient(120% 80% at 50% 0%,#1d2d58 0%,var(--cab) 62%);
  color:var(--ink);font-family:var(--font-body);
  display:grid;place-items:center;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}

#cab{display:grid;gap:calc(var(--u)*3);width:calc(var(--u)*244)}

/* marquee */
#hud{display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(var(--u)*2)}
.blk{display:grid;gap:calc(var(--u)*2)}
.blk.r{justify-items:end}
.lbl{font-size:calc(var(--u)*8);line-height:1;color:var(--marquee);letter-spacing:.1em}
#score{
  display:block;font-family:var(--font-display);font-size:calc(var(--u)*16);line-height:calc(var(--u)*20);
  color:var(--ink);font-variant-numeric:tabular-nums;
  text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--alert);
}
#lives{display:flex;gap:calc(var(--u)*3);height:calc(var(--u)*20)}
#lives canvas{width:calc(var(--u)*17);height:calc(var(--u)*20);image-rendering:pixelated}
#lives canvas.lost{opacity:.16;filter:grayscale(1)}

/* playfield */
#stage{
  position:relative;width:calc(var(--u)*244);height:calc(var(--u)*324);
  border:calc(var(--u)*2) solid var(--bezel);border-radius:calc(var(--u)*3);
  background:var(--bezel);overflow:hidden;outline:none;touch-action:none;cursor:pointer;
  box-shadow:0 0 0 1px #2c3d6e,0 calc(var(--u)*5) calc(var(--u)*16) rgba(0,0,0,.55);
}
#stage:focus-visible{box-shadow:0 0 0 2px var(--marquee)}
#cv{display:block;width:calc(var(--u)*240);height:calc(var(--u)*320)}
#crt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.3) 100%)}
.lines #crt::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--u) - 1px),rgba(0,0,0,.17) calc(var(--u) - 1px),rgba(0,0,0,.17) var(--u));
}

/* text over the playfield */
.ov{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*7);text-align:center;padding:calc(var(--u)*12);pointer-events:none;
}
.ov.dim{background:rgba(5,9,20,.6)}
.ov h1,.ov h2,.ov p{margin:0;font-weight:400;text-wrap:balance}
.ov p{font-size:calc(var(--u)*10);line-height:1.25;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #050914}
.title{
  font-size:calc(var(--u)*42);line-height:1;color:var(--marquee);letter-spacing:.02em;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--alert),calc(var(--u)*3.5) calc(var(--u)*3.5) 0 #050914;
}
.sub{color:var(--ink);letter-spacing:.32em;margin-top:calc(var(--u)*-3)!important}
#ov-title{justify-content:flex-start;padding-top:calc(var(--u)*40)}
.how{
  list-style:none;margin:calc(var(--u)*8) 0 0;padding:calc(var(--u)*7) calc(var(--u)*10);
  display:grid;gap:calc(var(--u)*5);text-align:left;font-size:calc(var(--u)*10);line-height:1;
  background:rgba(5,9,20,.72);border:calc(var(--u)*1) solid rgba(246,240,216,.28);
}
.how li{display:flex;align-items:center;gap:calc(var(--u)*5)}
.how .k{
  flex:none;width:calc(var(--u)*30);text-align:center;font-family:var(--font-display);font-size:calc(var(--u)*6);
  color:var(--marquee);
}
.how canvas{flex:none;width:calc(var(--u)*13);height:calc(var(--u)*13);margin:0 calc(var(--u)*8.5);image-rendering:pixelated}
.go{color:var(--marquee);font-size:calc(var(--u)*11)!important;margin-top:calc(var(--u)*12)!important;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.big{font-size:calc(var(--u)*34);line-height:1.05;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #050914}
.red{color:var(--alert)}
.gold{color:var(--marquee)}
.num{font-family:var(--font-display);font-size:.9em;color:var(--marquee)}
#ov-warn .big{animation:blink .7s steps(1) infinite}

#bossbar{
  position:absolute;left:calc(var(--u)*24);right:calc(var(--u)*24);top:calc(var(--u)*5);
  display:flex;align-items:center;gap:calc(var(--u)*4);pointer-events:none;
  font-size:calc(var(--u)*8);line-height:1;color:var(--ink);text-shadow:1px 1px 0 #050914;
}
#bossbar .bar{flex:1;height:calc(var(--u)*5);background:rgba(5,9,20,.75);border:calc(var(--u)*1) solid var(--ink)}
#bosshp{height:100%;width:100%;background:var(--alert)}
#toast{
  position:absolute;left:0;right:0;bottom:calc(var(--u)*64);text-align:center;pointer-events:none;
  font-size:calc(var(--u)*13);color:var(--marquee);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #050914;
}

/* control strip */
#strip{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*6);padding:0 calc(var(--u)*2);min-height:calc(var(--u)*12)}
#strip .cell{display:flex;align-items:center;gap:calc(var(--u)*4)}
#strip .lbl{font-size:calc(var(--u)*7)}
#power{display:flex;gap:calc(var(--u)*1.5)}
#power i{display:block;width:calc(var(--u)*5);height:calc(var(--u)*8);background:rgba(246,240,216,.16)}
#power i.on{background:var(--marquee)}
#hi{font-family:var(--font-display);font-size:calc(var(--u)*7);font-variant-numeric:tabular-nums}
#snd{
  font:inherit;font-size:calc(var(--u)*7);line-height:1;color:var(--ink);cursor:pointer;
  background:transparent;border:1px solid rgba(246,240,216,.4);border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*2) calc(var(--u)*4);
}
#snd:hover{border-color:var(--marquee);color:var(--marquee)}
#snd:focus-visible{outline:2px solid var(--marquee);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .go,#ov-warn .big{animation:none}
}
</style>
</head>
<body>
<main id="cab">
  <header id="hud">
    <div class="blk">
      <span class="lbl">점수</span>
      <output id="score">0</output>
    </div>
    <div class="blk r">
      <span class="lbl">목숨</span>
      <div id="lives" role="img" aria-label="남은 목숨 3"></div>
    </div>
  </header>

  <div id="stage" tabindex="0" aria-label="게임 화면">
    <canvas id="cv" width="240" height="320"></canvas>
    <div id="crt"></div>

    <div id="bossbar" hidden>
      <span>전함</span>
      <div class="bar"><div id="bosshp"></div></div>
    </div>
    <div id="toast" hidden></div>

    <section id="ov-title" class="ov">
      <h1 class="title">창공 편대</h1>
      <p class="sub">전함 격침 작전</p>
      <ul class="how">
        <li><span class="k">←↑↓→</span>방향키로 움직여요</li>
        <li><span class="k">AUTO</span>총은 자동으로 나가요</li>
        <li><canvas id="ico-p" width="13" height="13"></canvas>먹으면 총알이 강해져요</li>
      </ul>
      <p class="go">화면을 클릭하거나 엔터를 누르세요</p>
    </section>

    <section id="ov-warn" class="ov" hidden>
      <h2 class="big red">경고</h2>
      <p>거대 전함이 다가옵니다</p>
    </section>

    <section id="ov-over" class="ov dim" hidden>
      <h2 class="big red">게임 오버</h2>
      <p>점수 <span class="num" id="over-score">0</span></p>
      <p class="go">클릭하거나 엔터를 누르면 다시 시작</p>
    </section>

    <section id="ov-clear" class="ov dim" hidden>
      <h2 class="big gold">전함 격침!</h2>
      <p>남은 목숨 보너스 <span class="num" id="clear-bonus">0</span></p>
      <p>점수 <span class="num" id="clear-score">0</span></p>
      <p class="go">클릭하거나 엔터를 누르면 다음 작전</p>
    </section>

    <section id="ov-pause" class="ov dim" hidden>
      <h2 class="big">일시 정지</h2>
      <p>클릭하거나 P 키를 누르면 계속</p>
    </section>
  </div>

  <footer id="strip">
    <div class="cell"><span class="lbl">화력</span><div id="power" role="img" aria-label="화력 1단계"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="cell"><span class="lbl">최고</span><output id="hi">0</output></div>
    <button id="snd" type="button" aria-pressed="true">소리 켜짐</button>
  </footer>
</main>

<script>
(function(){
'use strict';
const W=240,H=320,TAU=Math.PI*2,HALF=Math.PI/2;
const $=id=>document.getElementById(id);
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkCanvas(w,h){const cv=document.createElement('canvas');cv.width=w;cv.height=h;return cv;}

/* ================= pixel art, all drawn from code ================= */
const PAL={
  w:'#ffffff',l:'#d5dde8',g:'#97a3b3',d:'#566273',k:'#1a1c2c',
  r:'#e43b44',R:'#9e2835',o:'#f77622',y:'#fee761',p:'#ffa7a5',
  G:'#3e8948',e:'#265c42',L:'#63c74d',
  b:'#0f8fd0',B:'#124e89',c:'#8fe6f7',
  s:'#c9a66b',T:'#733e39',v:'#68386c',m:'#b55088'
};
const OUT='#0b1433';
const SRC={
  player:[
    '.......k.......',
    '......rrr......',
    '......lwg......',
    '.....llwgg.....',
    '.....lwwwg.....',
    '.....lwcwg.....',
    '..lllwcbcwggg..',
    'lllwwwcbcwwwggg',
    'lrrwwwwbwwwwrrg',
    'dllllwwwwwggggd',
    '.ddddlwwwgdddd.',
    '......lwg......',
    '......lwg......',
    '......lwg......',
    '....lllwggg....',
    '....lrrwrrg....',
    '....ddlwgdd....',
    '.......d.......'],
  zako:[
    '....eGe....',
    '..eGGLGGe..',
    '....GLG....',
    '....GLG....',
    '.eeGGLGGee.',
    'eGGGGLGGGGe',
    'eGLLGyGLLGe',
    '.eeGGyGGee.',
    '....GLG....',
    '....eGe....',
    '.....k.....'],
  big:[
    '..........eeGee..........',
    '.......eGGGGLGGGGe.......',
    '.......eeeeGLGeeee.......',
    '..........GGLGG..........',
    '..........GGLGG..........',
    '..........GGLGG..........',
    '..eeeeeeeeGGLGGeeeeeeee..',
    '.eGGGGGGGGGGLGGGGGGGGGGe.',
    'eGGLLGGdddGGLGGdddGGLLGGe',
    'eGGGGGGdkdGGyGGdkdGGGGGGe',
    '.eeeeeedkdGGyGGdkdeeeeee.',
    '.......dddGGLGGddd.......',
    '.......lkl.GLG.lkl.......',
    '...........eGe...........',
    '............e............'],
  boat:[
    '...ddddd...',
    '..dgggggd..',
    '.dgsssssgd.',
    '.dgsssssgd.',
    '.dgsdddsgd.',
    '.dgsdkdsgd.',
    '.dgsdddsgd.',
    '.dgsssssgd.',
    '.dglllllgd.',
    '.dglkkklgd.',
    '.dglllllgd.',
    '.dgsssssgd.',
    '.dgsssssgd.',
    '.dgsssssgd.',
    '.dgsssssgd.',
    '.dgsssssgd.',
    '.dgsssssgd.',
    '..dgsssgd..',
    '..dgsssgd..',
    '...dgsgd...',
    '...dgggd...',
    '....dgd....',
    '.....d.....'],
  pb:['.w.','wyw','wyw','yyy','yoy','.o.'],
  pb2:['..w..','.wcw.','.wcw.','wcbcw','wcbcw','.cbc.','..b..'],
  eb:['.rrrr.','rpwwpr','rwwwwr','rwwwwr','rpwwpr','.rrrr.'],
  itemP:[
    '.yyyyyyyyy.',
    'yrrrrrrrrry',
    'yrrwwwwrrry',
    'yrrwrrrwrry',
    'yrrwrrrwrry',
    'yrrwwwwrrry',
    'yrrwrrrrrry',
    'yrrwrrrrrry',
    'yrrwrrrrrry',
    'yrrrrrrrrry',
    '.yyyyyyyyy.'],
  itemL:[
    '.yyyyyyyyy.',
    'yGGGGGGGGGy',
    'yGGwwGwwGGy',
    'yGwwwwwwwGy',
    'yGwwwwwwwGy',
    'yGwwwwwwwGy',
    'yGGwwwwwGGy',
    'yGGGwwwGGGy',
    'yGGGGwGGGGy',
    'yGGGGGGGGGy',
    '.yyyyyyyyy.']
};
function grid(rows,map){
  const h=rows.length,w=Math.max.apply(null,rows.map(r=>r.length)),d=new Array(w*h).fill(null);
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){let ch=r[i];if(ch==='.')continue;if(map&&map[ch])ch=map[ch];d[j*w+i]=PAL[ch]||'#ff00ff';}});
  return {w,h,d};
}
function toCanvas(g){
  const cv=mkCanvas(g.w,g.h),x=cv.getContext('2d');
  for(let j=0;j<g.h;j++)for(let i=0;i<g.w;i++){const v=g.d[j*g.w+i];if(v){x.fillStyle=v;x.fillRect(i,j,1,1);}}
  return cv;
}
function outline(g,col){
  const w=g.w+2,h=g.h+2,d=new Array(w*h).fill(null);
  const at=(i,j)=>i>=0&&j>=0&&i<g.w&&j<g.h?g.d[j*g.w+i]:null;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const v=at(i-1,j-1);
    if(v)d[j*w+i]=v;
    else if(at(i-2,j-1)||at(i,j-1)||at(i-1,j-2)||at(i-1,j))d[j*w+i]=col;
  }
  return {w,h,d};
}
function rotGrid(g,a){
  if(!a)return g;
  let N=Math.ceil(Math.hypot(g.w,g.h));if((N-g.w)%2)N++;
  const d=new Array(N*N).fill(null),ca=Math.cos(a),sa=Math.sin(a);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const dx=i+.5-N/2,dy=j+.5-N/2;
    const sx=Math.floor(dx*ca+dy*sa+g.w/2+1e-6),sy=Math.floor(-dx*sa+dy*ca+g.h/2+1e-6);
    if(sx>=0&&sy>=0&&sx<g.w&&sy<g.h)d[j*N+i]=g.d[sy*g.w+sx];
  }
  return {w:N,h:N,d};
}
function tint(src,col){
  const cv=mkCanvas(src.width,src.height),x=cv.getContext('2d');
  x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,cv.width,cv.height);
  return cv;
}
function sprOf(g){
  const raw=toCanvas(g),c=toCanvas(outline(g,OUT));
  return {c,w:c.width,h:c.height,wh:tint(c,'#ffffff'),sh:tint(raw,'#06122e')};
}
const mk=(rows,map)=>sprOf(grid(rows,map));
function mkRot(rows,map){const base=grid(rows,map),a=[];for(let k=0;k<16;k++)a.push(sprOf(rotGrid(base,k*TAU/16)));return a;}

const PL=mk(SRC.player);
const ROT={
  zako:mkRot(SRC.zako),
  red:mkRot(SRC.zako,{G:'r',e:'R',L:'p',y:'w'}),
  kami:mkRot(SRC.zako,{G:'o',e:'T',L:'y',y:'k'})
};
const BIG=mk(SRC.big),BOAT=mk(SRC.boat);
const PB=mk(SRC.pb),PB2=mk(SRC.pb2);
const EB=[mk(SRC.eb),mk(SRC.eb,{r:'o',p:'y'})];
const ITEM={P:[mk(SRC.itemP),mk(SRC.itemP,{y:'w'})],L:[mk(SRC.itemL),mk(SRC.itemL,{y:'w'})]};

/* sea: two shimmering tiles */
function mkSea(shift){
  const S=64,cv=mkCanvas(S,S),x=cv.getContext('2d'),r=mulberry(11);
  x.fillStyle='#1d62ad';x.fillRect(0,0,S,S);
  const put=(px,py,len,col)=>{x.fillStyle=col;for(let i=0;i<len;i++)x.fillRect(((px+i)%S+S)%S,((py%S)+S)%S,1,1);};
  for(let i=0;i<74;i++){
    const px=Math.floor(r()*S),py=Math.floor(r()*S),len=2+Math.floor(r()*5),k=r();
    put(px+(shift?(k<.5?1:-1):0),py,len+(shift&&k>.7?1:0),k<.6?'#2b78c6':k<.88?'#17508f':'#58a2e6');
  }
  for(let i=0;i<12;i++){const px=Math.floor(r()*S),py=Math.floor(r()*S);if((i+shift)%2===0)put(px,py,1+(i%2),'#b4dcf8');}
  return cv;
}
const SEA=[mkSea(0),mkSea(1)];

/* clouds: overlapping discs with a shaded lower-right rim */
function mkCloud(seed,w,h){
  const r=mulberry(seed),f=new Uint8Array(w*h),n=5+Math.floor(r()*3),cs=[];
  for(let i=0;i<n;i++){
    const m=1-Math.abs(i/(n-1)-.5)*1.1,rad=h*(0.2+0.2*m+0.08*r());
    cs.push([rad+2+(w-2*rad-4)*(i/(n-1)),h/2+(r()-.5)*h*0.22,rad]);
  }
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)for(const q of cs){if(Math.hypot(i+.5-q[0],j+.5-q[1])<q[2]){f[j*w+i]=1;break;}}
  const at=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&f[j*w+i];
  const cv=mkCanvas(w,h),x=cv.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    if(!f[j*w+i])continue;
    x.fillStyle=(!at(i+1,j+2)||!at(i,j+3))?'#b3cbe9':(!at(i+2,j+5)||!at(i,j+7))?'#dbe8f7':'#ffffff';
    x.fillRect(i,j,1,1);
  }
  return {c:cv,w,h,sh:tint(cv,'#082657')};
}
const CLOUD=[mkCloud(3,84,40),mkCloud(8,60,32),mkCloud(21,104,46),mkCloud(34,48,26),mkCloud(55,72,36)];

/* islands */
function mkIsle(seed,w,h){
  const r=mulberry(seed),cv=mkCanvas(w,h),x=cv.getContext('2d'),p1=r()*TAU,p2=r()*TAU,p3=r()*TAU;
  const hs=(i,j)=>{let n=Math.imul(i+seed*31,374761393)^Math.imul(j+seed*17,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const nx=(i+.5-w/2)/(w/2),ny=(j+.5-h/2)/(h/2),a=Math.atan2(ny,nx);
    const rad=0.68+0.1*Math.sin(a*2+p1)+0.07*Math.sin(a*3+p2)+0.04*Math.sin(a*5+p3);
    const d=Math.hypot(nx,ny)/rad,n=hs(i,j);let col=null;
    if(d<0.56){const t=hs(i>>1,(j>>1)+99);col=t<0.4?'#265c42':(n<0.12?'#63c74d':'#3e8948');}
    else if(d<0.68)col=n<0.3?'#3e8948':'#63c74d';
    else if(d<0.84)col=n<0.15?'#d9b98a':'#ead4aa';

/* explosion frames */
function mkBoom(size,seed){
  const r=mulberry(seed),frames=[],N=9,p1=r()*TAU,p2=r()*TAU;
  const hs=(i,j)=>{let n=Math.imul(i+seed,374761393)^Math.imul(j+seed*7,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;};
  for(let f=0;f<N;f++){
    const t=f/(N-1),cv=mkCanvas(size,size),x=cv.getContext('2d'),R=size/2*(0.3+0.7*Math.sqrt(t));
    for(let j=0;j<size;j++)for(let i=0;i<size;i++){
      const dx=i+.5-size/2,dy=j+.5-size/2,a=Math.atan2(dy,dx);
      const rr=R*(0.8+0.13*Math.sin(a*3+p1)+0.07*Math.sin(a*5+p2));
      const d=Math.hypot(dx,dy)/rr;if(d>1)continue;
      const n=hs(i,j);
      if(t>0.5&&n<(t-0.5)*1.75)continue;
      if(t>0.55&&d<(t-0.55)*1.7)continue;
      const heat=(1-d)*(1.15-t*1.1)+(n-.5)*0.12;
      x.fillStyle=heat>0.62?'#ffffff':heat>0.42?'#fee761':heat>0.25?'#f77622':heat>0.1?'#e43b44':(t>0.45?'#5d5a66':'#9e2835');
      x.fillRect(i,j,1,1);
    }
    frames.push(cv);
  }
  return frames;
}

const SW=66,SH=212,SCX=33;
function hullHW(y){
  if(y<0||y>=SH)return 0;
  if(y<62){const t=(y+1)/62;return Math.max(1,Math.round(30*Math.pow(Math.sin(t*HALF),0.8)));}
  if(y<172)return 30;
  const t=(y-172)/(SH-172);let v=30-7*t*t;if(y>=SH-3)v-=(y-(SH-4))*2.5;return Math.round(v);
}
function mkShip(){
  const cv=mkCanvas(SW,SH),x=cv.getContext('2d');
  const inside=(i,y)=>{const hw=hullHW(y);return hw>0&&i>=SCX-hw&&i<SCX+hw;};
  const depth=(i,y)=>{for(let k=1;k<=3;k++){if(!inside(i-k,y)||!inside(i+k,y)||!inside(i,y-k)||!inside(i,y+k))return k-1;}return 3;};
  for(let y=0;y<SH;y++)for(let i=0;i<SW;i++){
    if(!inside(i,y))continue;
    const dp=depth(i,y);let col;
    if(dp===0)col='#1c2333';
    else if(dp<3)col=i<SCX?'#8b97a9':'#5d697b';
    else col=((i-SCX+64)%4===0||(y+((i>>2)%3)*6)%18===0)?'#ab8b56':'#c7a56c';
    x.fillStyle=col;x.fillRect(i,y,1,1);
  }
  const disc=(cx,cy,r,col)=>{x.fillStyle=col;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(Math.hypot(i,j)<=r+.3)x.fillRect(cx+i,cy+j,1,1);};
  const box=(bx,by,bw,bh,top,hi,lo)=>{
    x.fillStyle='rgba(16,20,36,.42)';x.fillRect(bx+2,by+2,bw,bh);
    x.fillStyle=lo;x.fillRect(bx,by,bw,bh);
    x.fillStyle=top;x.fillRect(bx,by,bw-1,bh-1);
    x.fillStyle=hi;x.fillRect(bx,by,bw-1,1);x.fillRect(bx,by,1,bh-1);
  };
  /* anchor chains and breakwater at the bow */
  x.fillStyle='#6e5a3a';for(let y=12;y<30;y+=2){x.fillRect(30,y,1,1);x.fillRect(35,y,1,1);}
  x.fillStyle='#8b97a9';x.fillRect(22,32,22,1);
  /* barbettes under the main turrets, pads under the side guns */
  for(const y of [44,64,150,172]){disc(SCX,y,10,'#6f7b8d');disc(SCX,y,9,'#7f8b9d');}
  for(const y of [92,124]){disc(14,y,5,'#6f7b8d');disc(51,y,5,'#6f7b8d');}
  /* superstructure */
  box(19,80,28,58,'#8d99ab','#b4bfce','#566273');
  box(22,84,22,22,'#a3aebe','#cbd4e0','#667386');
  x.fillStyle='#1c2333';for(let i=25;i<41;i+=2)x.fillRect(i,87,1,2);
  box(27,91,12,12,'#c3ccd8','#e9edf3','#7d8898');
  disc(SCX,116,6,'#3c4656');disc(SCX,116,5,'#5a6577');disc(SCX,116,3,'#12151d');
  box(25,126,16,9,'#a3aebe','#cbd4e0','#667386');
  /* stern crane and deck markings */
  x.fillStyle='#8b97a9';x.fillRect(31,190,4,12);x.fillStyle='#566273';x.fillRect(32,190,2,12);
  x.fillStyle='#e9edf3';x.fillRect(24,204,1,3);x.fillRect(41,204,1,3);
  return cv;
}

/* ================= sound, synthesised ================= */
const SFX=(()=>{
  let ac=null,out=null,nbuf=null,muted=false,lastHit=-9,lastBoom=-9;
  function ensure(){
    if(!ac){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      try{
        ac=new AC();out=ac.createGain();out.gain.value=muted?0:0.55;
        const comp=ac.createDynamicsCompressor();out.connect(comp);comp.connect(ac.destination);
        nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
        const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      }catch(e){ac=null;return;}
    }
    if(ac.state==='suspended'){try{const p=ac.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  }
  function tone(type,f0,f1,dur,vol,at){
    if(!ac||muted)return;
    try{
      const t=ac.currentTime+(at||0),o=ac.createOscillator(),g=ac.createGain();
      o.type=type;o.frequency.setValueAtTime(f0,t);
      if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.03);
    }catch(e){}
  }
  function noise(dur,vol,f0,f1,at){
    if(!ac||muted)return;
    try{
      const t=ac.currentTime+(at||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      s.buffer=nbuf;s.loop=true;f.type='lowpass';
      f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);
    }catch(e){}
  }
  const seq=(type,notes,step,len,vol)=>notes.forEach((f,i)=>tone(type,f,f,len,vol,i*step));
  return {
    ensure,
    setMuted(m){muted=m;if(out)out.gain.value=m?0:0.55;},
    isMuted:()=>muted,
    shot(){tone('square',1300,620,0.05,0.026);},
    hit(){if(G.f-lastHit<3)return;lastHit=G.f;tone('square',270,180,0.04,0.05);},
    eshot(){tone('triangle',540,250,0.08,0.05);},
    boom(sz){
      if(sz<2&&G.f-lastBoom<2)return;lastBoom=G.f;
      if(sz===0){noise(0.22,0.22,2400,300);tone('triangle',180,50,0.18,0.18);}
      else if(sz===1){noise(0.45,0.32,1800,160);tone('sine',140,36,0.4,0.3);}
      else{noise(0.9,0.45,1400,70);tone('sine',110,28,0.8,0.4);tone('sawtooth',70,30,0.5,0.1);}
    },
    die(){noise(0.9,0.4,2600,90);tone('sawtooth',700,50,0.8,0.2);},
    power(){seq('square',[660,880,1100,1320,1760],0.055,0.07,0.07);},
    coin(){tone('square',990,990,0.06,0.07);tone('square',1320,1320,0.12,0.07,0.06);},
    oneUp(){seq('square',[784,988,1175,1568,1175,1568],0.08,0.09,0.07);},
    start(){seq('square',[392,523,659,784,1047],0.09,0.1,0.08);},
    warn(){for(let i=0;i<7;i++){const f=i%2?440:587;tone('square',f,f,0.3,0.085,i*0.5);tone('sawtooth',f/2,f/2,0.3,0.05,i*0.5);}},
    over(){[392,349,311,262,196].forEach((f,i)=>tone('triangle',f,f*0.97,0.32,0.16,i*0.28));},
    clear(){const m=[523,523,523,659,784,659,784,1047],d=[.12,.12,.12,.24,.12,.12,.12,.5];let t=0;m.forEach((f,i)=>{tone('square',f,f,d[i]*0.95,0.08,t);tone('triangle',f/2,f/2,d[i]*0.95,0.1,t);t+=d[i];});}
  };
})();

function fit(){

  if(k<1||u<uf*0.82)u=Math.floor(uf*100)/100;
  U=u;de.style.setProperty('--u',u+'px');
  const K=clamp(Math.ceil(u*dpr-1e-6),1,6);
  if(cv.width!==W*K){cv.width=W*K;cv.height=H*K;}
  vctx.imageSmoothingEnabled=false;

}

  else if(G.state==='clear'){G.loop++;startStage();SFX.start();}
}
function toggleSound(){
  const m=!SFX.isMuted();SFX.setMuted(m);
  sndBtn.textContent=m?'소리 꺼짐':'소리 켜짐';sndBtn.setAttribute('aria-pressed',String(!m));
}

function killPlayer(){
  const p=player;
  if(!p.alive||p.inv>0||G.state!=='play'||(G.boss&&G.boss.state==='dying'))return;
  p.alive=false;p.dead=80;G.lives--;G.power=Math.max(1,G.power-1);
  boom(p.x,p.y,1,true);SFX.die();G.shake=18;ebul.length=0;
}
function dropItem(x,y,k){items.push({x:clamp(x,12,W-12),y,k,t:0});}
function killEnemy(e){
  addScore(e.T.score,e.T.score>=800?e.x:undefined,e.y-6);
  boom(e.x,e.y,e.T.boom);
  if(e.T.boom)G.shake=Math.max(G.shake,6);
  if(e.grp&&++e.grp.k===e.grp.n){dropItem(e.x,e.y,'P');addScore(1000,e.x,e.y-8);}
  if(e.drop)dropItem(e.x,e.y,e.drop==='L'&&G.lives>=5?'P':e.drop);
}
function hitEnemy(e,dmg){
  e.hp-=dmg;
  if(e.hp<=0){killEnemy(e);return true;}
  e.fl=3;SFX.hit();return false;
}
function partDown(b,q,sx,sy){
  q.hp=0;
  if(q.k==='core'){bossDie(b);return;}
  addScore(q.k==='tur'?3000:1000,sx,sy-8);
  boom(sx,sy,q.k==='tur'?1:0);G.shake=Math.max(G.shake,q.k==='tur'?10:5);
  if(q.k==='tur')dropItem(sx,sy,'P');
}
function bossDie(b){
  b.state='dying';b.t=0;ebul.length=0;bossbar.hidden=true;
  for(const q of b.parts)q.hp=0;
  addScore(30000,b.x,b.y+100);G.shake=40;
  boom(b.x,b.y+109,2);
}

/* ================= update ================= */
function updatePlayer(){
  const p=player;
  if(!p.alive){
    if(--p.dead<=0){
      if(G.lives>0){p.alive=true;p.x=W/2;p.y=H-40;p.inv=150;p.fireT=10;}
      else gameOver();
    }
    return;
  }
  if(p.inv>0)p.inv--;
  let dx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
  let dy=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
  if(dx&&dy){dx*=0.7071;dy*=0.7071;}
  p.x=clamp(p.x+dx*2,9,W-9);p.y=clamp(p.y+dy*2,14,H-12);
  if(G.boss&&G.boss.state==='dying')return;
  if(--p.fireT<=0){
    const lv=G.power,x=p.x,y=p.y-9;
    const B=(ox,oy,vx,vy,strong)=>pbul.push({x:x+ox,y:y+oy,vx,vy,dmg:strong?2:1,s:strong?1:0});
    if(lv===1)B(0,0,0,-6);
    else if(lv===2){B(-3,1,0,-6);B(3,1,0,-6);}
    else if(lv===3){B(-3,1,0,-6);B(3,1,0,-6);B(-6,4,-1.2,-5.8);B(6,4,1.2,-5.8);}
    else if(lv===4){B(0,-1,0,-6);B(-5,2,0,-6);B(5,2,0,-6);B(-7,4,-1.5,-5.7);B(7,4,1.5,-5.7);}
    else{B(0,-1,0,-6.5,1);B(-5,2,0,-6.5);B(5,2,0,-6.5);B(-7,4,-1.4,-5.9);B(7,4,1.4,-5.9);B(-8,6,-2.8,-5.2);B(8,6,2.8,-5.2);}
    p.fireT=lv>=4?5:6;SFX.shot();
  }
}
function updatePBul(){
  const b=G.boss;
  outer:for(let i=pbul.length-1;i>=0;i--){
    const u=pbul[i];u.x+=u.vx;u.y+=u.vy;
    if(u.y<-10||u.x<-6||u.x>W+6){pbul.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];if(e.delay>0||e.y<-6)continue;
      if(Math.abs(u.x-e.x)<e.T.hw+2&&Math.abs(u.y-e.y)<e.T.hh+4){
        spark(u.x,u.y-2);if(hitEnemy(e,u.dmg))enemies.splice(j,1);
        pbul.splice(i,1);continue outer;
      }
    }
    if(b&&b.state==='fight'){
      for(const q of b.parts){
        if(q.hp<=0)continue;
        const sx=b.x-SCX+q.x,sy=b.y+q.y;
        if(Math.abs(u.x-sx)<q.hw+2&&Math.abs(u.y-sy)<q.hh+4){
          spark(u.x,u.y-2);q.hp-=u.dmg;q.fl=3;
          if(q.hp<=0)partDown(b,q,sx,sy);else SFX.hit();
          pbul.splice(i,1);continue outer;
        }
      }
    }
  }
}
function updateEnemies(){
  const p=player;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.delay>0){e.delay--;continue;}
    e.t++;if(e.fl>0)e.fl--;
    if(e.type==='big'){
      if(e.t<e.stay){if(e.y<e.ty)e.y+=0.7;else e.x+=Math.cos(e.t*0.02+e.ph)*0.35;}
      else e.y+=0.9;
      if(e.y>=e.ty-1&&e.t<e.stay&&--e.fire<=0&&p.alive){
        e.fire=110-Math.min(40,G.loop*12);
        const a=Math.atan2(p.y-e.y,p.x-e.x);
        for(const d of [-0.28,0,0.28])eshot(e.x,e.y+6,a+d,1.25*bSpd());
        SFX.eshot();
      }
    }else if(e.type==='boat'){
      e.y+=0.72;
      if(G.f%3===0)foam(e.x+rnd(-4,4),e.y-12,rnd(-0.1,0.1),rnd(0.3,0.5));
      if(e.y>24&&e.y<H*0.66&&--e.fire<=0&&p.alive){
        e.fire=125-Math.min(45,G.loop*12);
        eshot(e.x,e.y+2,Math.atan2(p.y-e.y,p.x-e.x),1.3*bSpd());SFX.eshot();
      }
    }else{
      if(e.sine){e.y+=e.spd;e.x=e.bx+Math.sin(e.t*e.sine.w+e.sine.p)*e.sine.a;}
      else{
        if(e.type==='kami'){
          if(e.t<55&&p.alive)e.ang+=clamp(angDiff(Math.atan2(p.y-e.y,p.x-e.x),e.ang),-0.045,0.045);
          e.spd=Math.min(2.7,e.spd+0.025);
        }else if(e.path){
          const s=e.path[e.pi];
          if(s){e.ang+=s[1];if(++e.pt>=s[0]){e.pi++;e.pt=0;}}
        }
        e.x+=Math.cos(e.ang)*e.spd;e.y+=Math.sin(e.ang)*e.spd;
      }
      if(e.fire>0&&--e.fire===0&&e.y>8&&e.y<H*0.58&&p.alive){
        eshot(e.x,e.y+3,Math.atan2(p.y-e.y,p.x-e.x),1.35*bSpd());SFX.eshot();
      }
    }
    if(e.t>40&&(e.x<-30||e.x>W+30||e.y>H+24||e.y<-40)){enemies.splice(i,1);continue;}
    if(!e.T.ground&&p.alive&&p.inv<=0&&Math.abs(e.x-p.x)<e.T.hw+3&&Math.abs(e.y-p.y)<e.T.hh+4){
      killPlayer();if(hitEnemy(e,6))enemies.splice(i,1);
    }
  }
}
function updateBoss(){
  const b=G.boss;if(!b)return;
  const p=player;b.t++;
  if(b.state!=='dying'||!b.burnt){
    /* wake behind the stern, spray at the bow */
    const sy=b.y+SH-3;
    for(let i=0;i<2;i++){const ox=rnd(-21,21);foam(b.x+ox,sy,ox*0.012,rnd(0.5,1.0));}
    if(G.f%2===0){const s=Math.random()<.5?-1:1,yy=irnd(6,58);foam(b.x+s*hullHW(yy),b.y+yy,s*rnd(0.15,0.4),rnd(0.5,0.9));}
  }
  if(b.state==='enter'){
    b.y+=0.9;
    if(b.y>=22){b.y=22;b.state='fight';b.t=0;}
    return;
  }
  if(b.state==='fight'){
    b.y=22+Math.sin(b.t*0.012)*6;b.x=120+Math.sin(b.t*0.007)*10;
    const core=b.parts[b.parts.length-1],ph2=core.hp<core.max*0.5;
    if(G.f%7===0)smoke(b.x,b.y+116);
    for(const q of b.parts){
      const sx=b.x-SCX+q.x,sy=b.y+q.y;
      if(q.hp<=0){if(G.f%10===0)smoke(sx,sy);continue;}
      if(q.fl>0)q.fl--;if(q.mf>0)q.mf--;
      if(q.k==='tur'){
        q.a+=clamp(angDiff(Math.atan2(p.y-sy,p.x-sx),q.a),-0.035,0.035);
        if(--q.cd<=0){q.burst=ph2?3:2;q.cd=(ph2?120:155)-Math.min(50,G.loop*14)+irnd(0,30);}
        if(q.burst>0&&b.t%9===0&&p.alive){
          q.burst--;q.mf=4;
          eshot(sx+Math.cos(q.a)*11,sy+Math.sin(q.a)*11,q.a,1.45*bSpd());SFX.eshot();
        }
      }else if(q.k==='gun'){
        if(--q.cd<=0&&p.alive){
          q.cd=(ph2?150:205)-Math.min(60,G.loop*16)+irnd(0,30);q.mf=4;
          for(const d of [-0.42,0,0.42])eshot(sx,sy+4,HALF+d,1.1*bSpd());
        }
      }else{
        if(--q.cd<=0&&p.alive){
          q.cd=(ph2?125:215)-Math.min(50,G.loop*14);
          const n=ph2?14:10,off=rnd(TAU);
          for(let i=0;i<n;i++)eshot(sx,sy,off+i*TAU/n,(ph2?1.2:1.0)*bSpd());
          SFX.eshot();
        }
        if(ph2&&G.f%4===0){parts.push({x:sx+rnd(-10,10),y:sy+rnd(-22,22),vx:rnd(-0.2,0.2),vy:rnd(0.2,0.6),life:irnd(10,22),col:FIRE[irnd(1,3)],sz:irnd(1,2),dr:1});smoke(sx+rnd(-8,8),sy+rnd(-20,20));}
      }
    }
    return;
  }
  /* dying */
  if(b.t%4===0)boom(b.x+rnd(-26,26),b.y+rnd(8,SH-8),irnd(0,1),b.t%12!==0);
  if(b.t%3===0)smoke(b.x+rnd(-20,20),b.y+rnd(20,SH-20));
  if(b.t===90){
    b.burnt=true;G.flash=1;G.shake=34;
    for(let i=0;i<7;i++)boom(b.x+rnd(-18,18),b.y+18+i*28,2,i>0);
  }
  if(b.t>90)b.y+=Math.min(1.7,0.3+(b.t-90)*0.02);
  if(b.y>H+12){G.boss=null;stageClear();}
}
function updateEBul(){
  const p=player;
  for(let i=ebul.length-1;i>=0;i--){
    const u=ebul[i];u.x+=u.vx;u.y+=u.vy;
    if(u.x<-8||u.x>W+8||u.y<-8||u.y>H+8){ebul.splice(i,1);continue;}
    if(p.alive&&p.inv<=0&&Math.abs(u.x-p.x)<4&&Math.abs(u.y-p.y)<4.5){ebul.splice(i,1);killPlayer();break;}
  }
}
function updateItems(){
  const p=player;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.t++;it.y+=0.55;it.x=clamp(it.x+Math.sin(it.t*0.06)*0.5,10,W-10);
    if(it.y>H+12){items.splice(i,1);continue;}
    if(p.alive&&Math.abs(it.x-p.x)<13&&Math.abs(it.y-p.y)<14){
      items.splice(i,1);
      if(it.k==='P'){
        if(G.power<5){G.power++;toast(G.power===5?'화력 최대!':'화력 강화!');SFX.power();}
        else{addScore(2000,it.x,it.y-6);SFX.coin();}
      }else{
        if(G.lives<5){G.lives++;toast('목숨 +1');SFX.oneUp();}
        else{addScore(5000,it.x,it.y-6);SFX.coin();}
      }
    }
  }
}
function updateFx(){
  G.bgY=(G.bgY+0.5)%64;
  for(let i=booms.length-1;i>=0;i--){if(++booms[i].t>=booms[i].fr.length*3)booms.splice(i,1);}
  for(const arr of [parts,gparts]){
    for(let i=arr.length-1;i>=0;i--){const q=arr[i];q.x+=q.vx;q.y+=q.vy;q.vx*=q.dr;q.vy*=q.dr;if(--q.life<=0)arr.splice(i,1);}
  }
  for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.y-=0.4;if(++q.t>48)pops.splice(i,1);}
  for(let i=clouds.length-1;i>=0;i--){const k=clouds[i];k.y+=k.s;if(k.y-CLOUD[k.k].h/2>H+24)clouds.splice(i,1);}
  if(!G.noCloud&&--G.cloudT<=0){
    G.cloudT=irnd(90,230);const k=irnd(0,CLOUD.length-1);
    clouds.push({k,x:rnd(-10,W+10),y:-CLOUD[k].h/2-4,s:rnd(0.8,1.1)});
  }
  for(let i=isles.length-1;i>=0;i--){const s=isles[i];s.y+=0.5;if(s.y-ISLE[s.k].height/2>H+4)isles.splice(i,1);}
  if(!G.boss&&G.warn<=0&&--G.isleT<=0){
    G.isleT=irnd(600,1100);const k=irnd(0,2);
    isles.push({k,x:Math.random()<.5?irnd(16,40):irnd(W-40,W-16),y:-ISLE[k].height/2-2});
  }
  if(G.shake>0)G.shake--;
  if(G.flash>0)G.flash=Math.max(0,G.flash-0.045);
  if(G.lock>0)G.lock--;
  if(G.toastT>0&&--G.toastT===0)elToast.hidden=true;
}
function update(){
  if(G.paused)return;
  G.f++;
  updateFx();
  if(G.state==='title'){player.x=W/2+Math.sin(G.f*0.02)*22;player.y=H-40;return;}
  if(G.state==='over')return;
  if(G.state==='clear'){updatePlayer();pbul.length=0;return;}
  G.tick++;
  while(G.wi<TL.length&&G.tick>=TL[G.wi][0]*60)TL[G.wi++][1]();
  if(G.warn>0&&--G.warn===0){ovWarn.hidden=true;G.boss=mkBoss();bossbar.hidden=false;}
  updatePlayer();updatePBul();updateEnemies();updateBoss();updateEBul();updateItems();
  const b=G.boss;
  if(b){
    let h=0,m=0;for(const q of b.parts){h+=Math.max(0,q.hp);m+=q.max;}
    const pc=Math.ceil(h/m*100);
    if(pc!==shown.boss){shown.boss=pc;bosshp.style.width=pc+'%';}
  }
}

/* ================= draw ================= */
const blit=(img,x,y)=>ctx.drawImage(img,Math.round(x-img.width/2),Math.round(y-img.height/2));
const dirIdx=a=>((Math.round((a-HALF)/(TAU/16))%16)+16)%16;
const airSpr=e=>e.type==='big'?BIG:ROT[e.type][dirIdx(e.sine?HALF:e.ang)];
function barrels(cx,cy,a,len,two){
  const ca=Math.cos(a),sa=Math.sin(a),offs=two?[-2,2]:[0];
  for(let k=3;k<=len;k++)for(const o of offs){
    ctx.fillStyle=k>=len-1?'#0e1118':'#2c3445';
    ctx.fillRect(Math.round(cx+ca*k-sa*o-1),Math.round(cy+sa*k+ca*o-1),2,2);
  }
}
function drawNum(n,x,y,col){
  const s=String(n);let px=Math.round(x-s.length*2);const py=Math.round(y);
  for(const ch of s){
    const g=DG[+ch];
    ctx.fillStyle=OUT;for(let k=0;k<15;k++)if(g[k]==='1')ctx.fillRect(px+k%3+1,py+((k/3)|0)+1,1,1);
    ctx.fillStyle=col;for(let k=0;k<15;k++)if(g[k]==='1')ctx.fillRect(px+k%3,py+((k/3)|0),1,1);
    px+=4;
  }
}
function drawBoss(b){
  const x0=Math.round(b.x-SCX),y0=Math.round(b.y);
  ctx.drawImage(b.burnt?SHIPB:SHIP,x0,y0);
  for(const q of b.parts){
    const sx=x0+q.x,sy=y0+q.y;
    if(q.k==='core'){
      if(q.hp>0){
        if(q.fl>0){ctx.globalAlpha=.45;ctx.fillStyle='#ffffff';ctx.fillRect(sx-14,sy-29,28,58);ctx.globalAlpha=1;}
        if((G.f>>4)&1){ctx.fillStyle='#ff5347';ctx.fillRect(sx-1,sy-13,2,2);}
      }
      continue;
    }
    const S=q.k==='tur'?TUR:GUN;
    if(q.hp<=0){
      blit(S.dead,sx,sy);
      if(!b.burnt&&(G.f+q.y)%8<4){ctx.fillStyle=(G.f&8)?'#f77622':'#fee761';ctx.fillRect(sx-1+((G.f>>3)%3)-1,sy-1,2,2);}
      continue;
    }
    blit(q.fl>0?S.wh:S.c,sx,sy);
    if(q.k==='tur'){
      barrels(sx,sy,q.a,11,true);
      if(q.mf>0){ctx.fillStyle='#fee761';ctx.fillRect(Math.round(sx+Math.cos(q.a)*13)-2,Math.round(sy+Math.sin(q.a)*13)-2,4,4);}
    }else{
      barrels(sx,sy,HALF,6,false);
      if(q.mf>0){ctx.fillStyle='#fee761';ctx.fillRect(sx-1,sy+7,3,3);}
    }
  }
}
function draw(){
  const p=player;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#1d62ad';ctx.fillRect(0,0,W,H);
  if(G.shake>0&&!reduceMotion&&!G.paused)ctx.translate(irnd(-2,2),irnd(-2,2));

  const tile=SEA[(G.f>>5)&1],off=Math.floor(G.bgY);
  for(let y=off-128;y<H+4;y+=64)for(let x=-64;x<W+4;x+=64)ctx.drawImage(tile,x,y);
  for(const s of isles)blit(ISLE[s.k],s.x,s.y);
  for(const q of gparts){if(q.life<14&&(q.life&1))continue;ctx.fillStyle=q.col;ctx.fillRect(q.x|0,q.y|0,q.sz,q.sz);}

  for(const e of enemies){
    if(e.type!=='boat'||e.delay>0)continue;
    blit(e.fl>0?BOAT.wh:BOAT.c,e.x,e.y);
    const a=Math.atan2(p.y-e.y,p.x-e.x);
    ctx.fillStyle='#566273';ctx.fillRect(Math.round(e.x)-2,Math.round(e.y)+2,5,5);
    ctx.fillStyle='#97a3b3';ctx.fillRect(Math.round(e.x)-1,Math.round(e.y)+3,3,3);
    barrels(e.x,e.y+4.5,a,6,false);
  }
  if(G.boss)drawBoss(G.boss);

  ctx.globalAlpha=.2;
  for(const k of clouds){const C=CLOUD[k.k];ctx.drawImage(C.sh,Math.round(k.x-C.w/2+9),Math.round(k.y-C.h/2+13));}
  ctx.globalAlpha=1;
  for(const k of clouds)blit(CLOUD[k.k].c,k.x,k.y);

  const showP=G.state==='title'||(p.alive&&G.state!=='over'&&(p.inv<=0||((G.f>>2)&1)));
  ctx.globalAlpha=.26;
  for(const e of enemies){
    if(e.T.ground||e.delay>0)continue;
    const s=airSpr(e).sh;ctx.drawImage(s,Math.round(e.x-s.width/2+5),Math.round(e.y-s.height/2+9));
  }
  if(showP)ctx.drawImage(PL.sh,Math.round(p.x-PL.sh.width/2+6),Math.round(p.y-PL.sh.height/2+11));
  ctx.globalAlpha=1;

  for(const it of items)blit(ITEM[it.k][(G.f>>3)&1].c,it.x,it.y);
  for(const e of enemies){
    if(e.T.ground||e.delay>0)continue;
    const s=airSpr(e);blit(e.fl>0?s.wh:s.c,e.x,e.y);
  }
  for(const u of pbul)blit(u.s?PB2.c:PB.c,u.x,u.y);
  if(showP){
    blit(PL.c,p.x,p.y);
    const yy=Math.round(p.y-PL.h/2)+1,xx=Math.round(p.x);
    ctx.fillStyle='rgba(235,243,255,.8)';
    if(G.f&2)ctx.fillRect(xx-4,yy,7,1);else ctx.fillRect(xx-2,yy,3,1);
  }
  for(const b of booms)blit(b.fr[Math.min(b.fr.length-1,(b.t/3)|0)],b.x,b.y);
  for(const q of parts){if(q.life<8&&(q.life&1))continue;ctx.fillStyle=q.col;ctx.fillRect(q.x|0,q.y|0,q.sz,q.sz);}
  const eb=EB[(G.f>>2)&1].c;
  for(const u of ebul)blit(eb,u.x,u.y);
  for(const q of pops)drawNum(q.n,q.x,q.y,(q.t&4)?'#ffffff':'#fee761');

  if(G.flash>0&&!reduceMotion){
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=Math.min(0.8,G.flash);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
  vctx.drawImage(buf,0,0,cv.width,cv.height);
  hud();
}

/* ================= input ================= */
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(k.indexOf('Arrow')===0||k==='Space'||k==='Enter'||k==='NumpadEnter')e.preventDefault();
  if(e.repeat)return;
  keys[k]=true;
  if(k==='Enter'||k==='NumpadEnter'||k==='Space'){SFX.ensure();if(G.state!=='play'||G.paused)action();}
  else if(k==='KeyP'||k==='Escape'){if(G.state==='play')setPause(!G.paused);}
  else if(k==='KeyM')toggleSound();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(G.state==='play'&&!G.paused)setPause(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.paused)setPause(true);});
let drag=null;
stage.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{stage.focus({preventScroll:true});}catch(_){}
  SFX.ensure();
  if(G.state!=='play'||G.paused){action();return;}
  if(e.pointerType!=='mouse'){drag={id:e.pointerId,x:e.clientX,y:e.clientY};try{stage.setPointerCapture(e.pointerId);}catch(_){}}
});
stage.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=(e.clientX-drag.x)/U,dy=(e.clientY-drag.y)/U;drag.x=e.clientX;drag.y=e.clientY;
  if(player.alive&&G.state==='play'&&!G.paused){player.x=clamp(player.x+dx*1.25,9,W-9);player.y=clamp(player.y+dy*1.25,14,H-12);}
});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null;};
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
sndBtn.addEventListener('click',()=>{SFX.ensure();toggleSound();sndBtn.blur();try{stage.focus({preventScroll:true});}catch(_){}});
window.addEventListener('resize',fit);

/* ================= boot ================= */
let last=0,acc=0;
const STEP=1000/60;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  let dt=ts-last;last=ts;if(dt>100)dt=100;
  acc+=dt;let n=0;
  while(acc>=STEP&&n<5){update();acc-=STEP;n++;}
  if(n===5)acc=0;
  draw();
}
function boot(data){
  if(data&&data.hi>G.hi)G.hi=data.hi;
  fit();
  clouds.push({k:0,x:58,y:118,s:0.9},{k:3,x:196,y:206,s:1.0},{k:1,x:176,y:30,s:0.85});
  isles.push({k:0,x:34,y:226});
  hud();
  try{stage.focus({preventScroll:true});}catch(_){}
  requestAnimationFrame(frame);
}

const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({hi:G.hi}));
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
