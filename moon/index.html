<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>달빛 찻집 마당</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#141b30;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;touch-action:none;user-select:none}
canvas{display:block}
.pill{position:fixed;background:rgba(20,26,44,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:999px;display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:clamp(15px,1.6vw,19px)}
#top{top:14px;left:14px}
#top b{font-weight:800}
#sub{top:62px;left:14px;font-size:clamp(13px,1.3vw,16px);padding:6px 14px;opacity:.9}
#right{top:14px;right:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#bar{bottom:16px;left:50%;transform:translateX(-50%);gap:6px;padding:8px 10px;border-radius:26px}
#bar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(64px,7vw,92px);padding:8px 10px;border-radius:18px;font-size:clamp(14px,1.5vw,19px);font-weight:700}
#bar button span{font-size:clamp(22px,2.6vw,32px);line-height:1}
#bar button:hover,#bar button.on{background:rgba(19,255,106,.18)}
#hint{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);border-radius:12px;padding:8px 16px;font-size:clamp(14px,1.5vw,18px);transition:opacity 1.5s;text-align:center}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#modal.show{display:flex}
#card{background:rgba(24,30,50,.96);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:18px;width:min(92vw,520px)}
#card h3{margin:0 0 4px;font-size:22px}
#card p{margin:0 0 10px;font-size:14px;opacity:.8}
#map{width:100%;aspect-ratio:1;border-radius:14px;background:#0f1424;display:block;cursor:pointer}
#close{margin-top:12px;width:100%;padding:12px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:800;font-size:18px}
#toast{position:fixed;bottom:172px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 18px;border-radius:14px;font-size:clamp(15px,1.7vw,20px);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#load{position:fixed;inset:0;background:#141b30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:20px;transition:opacity .8s}
</style>
</head>
<body>
<div id="load"><div style="font-size:30px;font-weight:800">달빛 찻집</div><div>마당을 열고 있어요…</div></div>
<div class="pill" id="top"><span>🏮</span><b>달빛 찻집 마당</b><span style="opacity:.7" id="srv">서버 1</span></div>
<div class="pill" id="sub">함께 있는 사람 <b id="cnt" style="margin:0 4px">0</b>명 <span style="opacity:.6">(구경꾼은 지어낸 인물)</span></div>
<div class="pill" id="right"><button id="bMap">🗺 지도</button><button id="bSnd">🔊 소리</button></div>
<div id="hint">바닥을 눌러 걸어요 · 드래그로 둘러보기 · 휠로 확대/축소 · 방향키(WASD)도 돼요</div>
<div id="toast"></div>
<div class="pill" id="bar">
  <button data-a="wave"><span>👋</span>인사</button>
  <button data-a="sit"><span>🪑</span>앉기</button>
  <button data-a="tea"><span>🍵</span>차 마시기</button>
  <button data-a="lantern"><span>🏮</span>등불 띄우기</button>
</div>
<div id="modal"><div id="card"><h3>마당 둘러보기</h3><p>지도에서 가고 싶은 곳을 누르면 그리로 걸어가요.</p><canvas id="map" width="480" height="480"></canvas><button id="close">닫기</button></div></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a), PICK=a=>a[Math.floor(Math.random()*a.length)];
const url=new URL(location.href); const STAGE=parseInt(url.searchParams.get('v')||'9',10); // 단계 스위치(영상 촬영용): 1 걷기 2 둘러보기 3 사람 4 활동 5 분위기 9 전체
const FINAL=STAGE>=6;
const WORLD=46;

/* ---------- 장면 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false; document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const dusk=STAGE>=5?0x1d2748:0x6fa8d8;
scene.background=new THREE.Color(dusk); scene.fog=new THREE.Fog(dusk,38,110);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,300);
scene.add(new THREE.HemisphereLight(STAGE>=5?0x8fa3e6:0xffffff,0x3a2a22,STAGE>=5?1.5:1.1));
const moon=new THREE.DirectionalLight(STAGE>=5?0xaabcff:0xfff2d6,STAGE>=5?1.0:1.2); moon.position.set(-30,50,20); scene.add(moon);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9,metalness:0},o));
const E=(c,i=1.6)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i,roughness:.6});
function add(g,m,x,y,z,p=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o}

// 땅
const ground=add(new THREE.CircleGeometry(80,64),M(0x6b7d4c),0,0,0); ground.rotation.x=-Math.PI/2;
const dirt=add(new THREE.CircleGeometry(WORLD+4,64),M(0x8a7653),0,.01,0); dirt.rotation.x=-Math.PI/2;
// 돌길
for(let i=0;i<14;i++){const s=add(new THREE.BoxGeometry(3.2+R(-.3,.3),.08,1.7),M(0x9a9da8),R(-.3,.3),.05,18-i*2.0)}
for(let i=0;i<8;i++){add(new THREE.BoxGeometry(2.4,.08,1.5),M(0x9a9da8),10+i*1.9,.05,10-i*.9)}

const colliders=[]; // [x,z,r]
const col=(x,z,r)=>colliders.push([x,z,r]);
const lights=[];
// 찻집 마루
const PAV={x:0,z:-16,w:13,d:8};
add(new THREE.BoxGeometry(PAV.w,.5,PAV.d),M(0x6b4a2e),PAV.x,.25,PAV.z);
const heightAt=(x,z)=>(Math.abs(x-PAV.x)<PAV.w/2-.2&&Math.abs(z-PAV.z)<PAV.d/2-.2)?.5:0;
for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){add(new THREE.CylinderGeometry(.3,.34,5,10),M(0x7a2418),PAV.x+sx*(PAV.w/2-.7),3,PAV.z+sz*(PAV.d/2-.7)); col(PAV.x+sx*(PAV.w/2-.7),PAV.z+sz*(PAV.d/2-.7),.55)}
const roof=add(new THREE.ConeGeometry(11.5,3.6,4),M(0x2b2f3a),PAV.x,6.8,PAV.z); roof.rotation.y=Math.PI/4; roof.scale.z=.68;
add(new THREE.BoxGeometry(PAV.w+1,.3,.3),M(0x2b2f3a),PAV.x,5.7,PAV.z+PAV.d/2+.3);
// 간판
const sc=document.createElement('canvas'); sc.width=512; sc.height=160; const sx=sc.getContext('2d');
sx.fillStyle='#1c2a22'; sx.fillRect(0,0,512,160); sx.strokeStyle='#d8b86a'; sx.lineWidth=6; sx.strokeRect(8,8,496,144);
sx.fillStyle='#f3e6b8'; sx.font='800 84px "Malgun Gothic",sans-serif'; sx.textAlign='center'; sx.textBaseline='middle'; sx.fillText('달빛 찻집',256,86);
const signTex=new THREE.CanvasTexture(sc); const sign=add(new THREE.PlaneGeometry(5,1.56),new THREE.MeshBasicMaterial({map:signTex}),PAV.x,5.0,PAV.z+PAV.d/2-.4);
// 탁자와 찻잔
for(const tx of [-3,3]){add(new THREE.BoxGeometry(2.4,.12,1.4),M(0x8a6238),PAV.x+tx,1.05,PAV.z-.5); for(const [a,b] of [[-1,-.5],[1,-.5],[-1,.5],[1,.5]]) add(new THREE.CylinderGeometry(.07,.07,.55,6),M(0x5a3f24),PAV.x+tx+a,.78,PAV.z-.5+b);
  add(new THREE.CylinderGeometry(.16,.12,.18,10),M(0xf3efe6),PAV.x+tx-.4,1.2,PAV.z-.5); add(new THREE.CylinderGeometry(.16,.12,.18,10),M(0xf3efe6),PAV.x+tx+.4,1.2,PAV.z-.5);}
col(PAV.x-3,PAV.z-.5,1.3); col(PAV.x+3,PAV.z-.5,1.3);
// 매달린 등
function lantern(x,y,z,c=0xffa347,withLight=false){const g=new THREE.Group();g.position.set(x,y,z);add(new THREE.SphereGeometry(.32,12,10),E(c,2.2),0,0,0,g).scale.y=1.25;add(new THREE.CylinderGeometry(.04,.04,.9,5),M(0x222222),0,.9,0,g);scene.add(g);
  if(withLight){const L=new THREE.PointLight(c,28,18,1.6);L.position.set(x,y,z);scene.add(L);lights.push(L)}return g}
for(let i=0;i<6;i++){lantern(PAV.x-5.2+i*2.08,5.1,PAV.z+PAV.d/2-.3,PICK([0xff9a3c,0xff7a5c,0xffc15a]),false)}
lantern(PAV.x-4,4.9,PAV.z+1,0xffb35a,true); lantern(PAV.x+4,4.9,PAV.z+1,0xffb35a,true);
// 돌등
function stoneLamp(x,z){add(new THREE.CylinderGeometry(.28,.34,.9,8),M(0x8a8e96),x,.45,z);add(new THREE.BoxGeometry(.7,.55,.7),E(0xffd48a,1.7),x,1.2,z);add(new THREE.ConeGeometry(.6,.5,4),M(0x70747c),x,1.75,z).rotation.y=Math.PI/4;col(x,z,.5)}
for(let i=0;i<6;i++){stoneLamp(-3.2,16-i*5);stoneLamp(3.2,16-i*5)}
// 연못
const POND={x:-17,z:4,r:6.5};
const pond=add(new THREE.CircleGeometry(POND.r,40),new THREE.MeshStandardMaterial({color:0x1c4e72,roughness:.15,metalness:.2,emissive:0x0b2438,emissiveIntensity:.7}),POND.x,.03,POND.z); pond.rotation.x=-Math.PI/2;
for(let i=0;i<22;i++){const a=i/22*Math.PI*2;add(new THREE.SphereGeometry(R(.35,.65),7,6),M(0x6e717a),POND.x+Math.cos(a)*(POND.r+.2),.2,POND.z+Math.sin(a)*(POND.r+.2))}
for(let i=0;i<9;i++){const a=R(0,6.28),d=R(0,POND.r-1.2);const l=add(new THREE.CylinderGeometry(.55,.55,.06,12),M(0x2f8a4a),POND.x+Math.cos(a)*d,.07,POND.z+Math.sin(a)*d);if(i%2)add(new THREE.SphereGeometry(.2,8,6),E(0xff9ec4,.8),l.position.x,.22,l.position.z)}
col(POND.x,POND.z,POND.r+.3);
// 돌탑
const TOWER={x:17,z:-4};
for(let i=0;i<5;i++){const w=3.4-i*.55;add(new THREE.BoxGeometry(w,.9,w),M(0x9a9ea6),TOWER.x,.45+i*1.5,TOWER.z);const rf=add(new THREE.ConeGeometry(w*.95,.7,4),M(0x7c8088),TOWER.x,1.15+i*1.5,TOWER.z);rf.rotation.y=Math.PI/4}
add(new THREE.SphereGeometry(.45,10,8),M(0xc9b36a),TOWER.x,7.9,TOWER.z); col(TOWER.x,TOWER.z,2.1);
// 모닥불
const FIRE={x:13,z:12};
for(let i=0;i<4;i++){const a=i*1.57;add(new THREE.CylinderGeometry(.14,.14,1.4,6),M(0x4a2f1a),FIRE.x+Math.cos(a)*.35,.28,FIRE.z+Math.sin(a)*.35).rotation.set(Math.sin(a)*1.1,0,-Math.cos(a)*1.1)}
const flame=add(new THREE.ConeGeometry(.55,1.5,8),E(0xff8a2a,2.4),FIRE.x,.95,FIRE.z);
const fireLight=new THREE.PointLight(0xff8a3a,STAGE>=5?60:15,24,1.5); fireLight.position.set(FIRE.x,1.4,FIRE.z); scene.add(fireLight);
for(let i=0;i<5;i++){const a=i/5*6.28;add(new THREE.CylinderGeometry(.4,.4,1.1,8),M(0x6a4a2a),FIRE.x+Math.cos(a)*3,.35,FIRE.z+Math.sin(a)*3).rotation.z=1.5708;col(FIRE.x+Math.cos(a)*3,FIRE.z+Math.sin(a)*3,.7)}
col(FIRE.x,FIRE.z,.9);
// 나무
const leaf=[0xc0392b,0xe67e22,0xf1c40f,0xd35400,0x2f6b3a];
for(let i=0;i<150;i++){const a=R(0,6.28),d=R(WORLD-14,WORLD+22);const x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.abs(x)<6&&z>0)continue;const s=R(.8,1.5),c=PICK(leaf);
  add(new THREE.CylinderGeometry(.35*s,.5*s,3.6*s,7),M(0x5a3b25),x,1.8*s,z);add(new THREE.ConeGeometry(2.6*s,4.6*s,8),M(c),x,5.2*s,z);add(new THREE.ConeGeometry(1.9*s,3.6*s,8),M(c),x,7.4*s,z);if(d<WORLD+3)col(x,z,.9*s)}
for(let i=0;i<20;i++){const a=R(0,6.28),d=R(10,WORLD-6);const x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x-POND.x,z-POND.z)<POND.r+3||Math.hypot(x-FIRE.x,z-FIRE.z)<5||Math.hypot(x-PAV.x,z-PAV.z)<10||Math.hypot(x-TOWER.x,z-TOWER.z)<4||(Math.abs(x)<5&&z>-10))continue;const s=R(.7,1.1),c=PICK(leaf);add(new THREE.CylinderGeometry(.3*s,.42*s,3*s,7),M(0x5a3b25),x,1.5*s,z);add(new THREE.ConeGeometry(2.1*s,4*s,8),M(c),x,4.2*s,z);col(x,z,.8*s)}
// 별과 달
if(STAGE>=5){const sp=[];for(let i=0;i<500;i++){const a=R(0,6.28),b=R(.15,1.4),r=180;sp.push(Math.cos(a)*Math.cos(b)*r,Math.sin(b)*r,Math.sin(a)*Math.cos(b)*r)}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.3,fog:false})));
 add(new THREE.SphereGeometry(7,20,16),new THREE.MeshBasicMaterial({color:0xfff3cf,fog:false}),-90,95,-100)}
// 떨어지는 낙엽
const LN=STAGE>=5?260:0; let leaves=null,lpos,lvel;
if(LN){lpos=new Float32Array(LN*3);lvel=new Float32Array(LN*2);for(let i=0;i<LN;i++){lpos[i*3]=R(-40,40);lpos[i*3+1]=R(0,22);lpos[i*3+2]=R(-40,40);lvel[i*2]=R(.2,.8);lvel[i*2+1]=R(.8,1.8)}
 const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(lpos,3));leaves=new THREE.Points(lg,new THREE.PointsMaterial({color:0xe67e22,size:.34}));scene.add(leaves)}

/* ---------- 캐릭터 ---------- */
function nameSprite(t,color='#fff'){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='rgba(15,20,36,.72)';const w=Math.min(250,x.measureText(t).width+40);
  x.font='800 30px "Malgun Gothic",sans-serif';const tw=x.measureText(t).width+34;const L=128-tw/2;x.beginPath();x.roundRect(L,8,tw,46,23);x.fill();x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,32);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(3.2,.8,1);sp.renderOrder=10;return sp}
function makeChar(robe,name,isMe){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const skin=M(0xf0c9a0);
  add(new THREE.CylinderGeometry(.42,.58,1.25,12),M(robe),0,1.05,0,body);
  add(new THREE.CylinderGeometry(.44,.6,.28,12),M(0xf2c14e),0,.82,0,body);
  add(new THREE.SphereGeometry(.46,16,12),skin,0,2.0,0,body);
  add(new THREE.SphereGeometry(.47,16,12,0,6.3,0,1.2),M(isMe?0x2a2a2a:0x3a2e28),0,2.04,0,body);
  add(new THREE.SphereGeometry(.05,6,6),M(0x222222),-.16,2.02,.42,body);add(new THREE.SphereGeometry(.05,6,6),M(0x222222),.16,2.02,.42,body);
  const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.55,1.5,0);armR.position.set(.55,1.5,0);body.add(armL,armR);
  add(new THREE.CylinderGeometry(.11,.11,.8,7),M(robe),0,-.35,0,armL);add(new THREE.CylinderGeometry(.11,.11,.8,7),M(robe),0,-.35,0,armR);
  add(new THREE.SphereGeometry(.13,8,6),skin,0,-.8,0,armL);add(new THREE.SphereGeometry(.13,8,6),skin,0,-.8,0,armR);
  const legL=add(new THREE.BoxGeometry(.28,.5,.38),M(0x3a3f55),-.22,.28,0,body),legR=add(new THREE.BoxGeometry(.28,.5,.38),M(0x3a3f55),.22,.28,0,body);
  const cup=add(new THREE.CylinderGeometry(.13,.1,.16,10),M(0xf3efe6),0,-.8,.2,armR);cup.visible=false;
  const tag=nameSprite(name,isMe?'#13ff6a':'#fff');tag.position.y=3.25;g.add(tag);
  g.userData={body,armL,armR,legL,legR,cup,tag};scene.add(g);return g}
const MYNAMES=['졸린 달팽이','느린 구름','맑은 빗방울','조용한 여우','따뜻한 호빵','수줍은 두루미','푸른 솔방울','느긋한 거북'];
let myName=null;try{myName=localStorage.getItem('moon_name')}catch(e){}
if(!myName){myName=PICK(MYNAMES);try{if(FINAL)localStorage.setItem('moon_name',myName)}catch(e){}}
const me={x:0,z:20,yaw:Math.PI,tx:null,tz:null,act:null,actT:0,sit:false,speed:6.2,obj:makeChar(0x5b7fa6,myName,true)};
me.obj.position.set(me.x,0,me.z);

const NPCN=['배부른 곰','느린 구름','맑은 빗방울','조용한 여우','따뜻한 호빵','수줍은 두루미','푸른 솔방울','느긋한 거북','배고픈 다람쥐','늦잠 고양이','웃는 감자','차분한 바위'];
const ROBES=[0xa86a4a,0x6a9a6e,0x9a6aa8,0xb59a4a,0x4a8aa8,0xa84a5a,0x7a7aa8,0x8aa84a];
const npcs=[]; const NN=STAGE>=3?9:0;
for(let i=0;i<NN;i++){const o=makeChar(ROBES[i%ROBES.length],NPCN[i],false);const a=R(0,6.28),d=R(6,26);const n={x:Math.cos(a)*d,z:Math.sin(a)*d+4,yaw:R(0,6.28),tx:null,tz:null,wait:R(0,3),act:null,actT:0,sit:false,speed:R(3.2,4.6),obj:o,queue:false};
  if(Math.hypot(n.x-POND.x,n.z-POND.z)<POND.r+1.5){n.x=0;n.z=8+i}o.position.set(n.x,0,n.z);npcs.push(n)}
$('#cnt').textContent=STAGE>=3?npcs.length+1:1;

/* ---------- 이동·충돌 ---------- */
function push(p,r=.45){for(const [cx,cz,cr] of colliders){const dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz),m=cr+r;if(d<m&&d>1e-4){p.x=cx+dx/d*m;p.z=cz+dz/d*m}}
  const d=Math.hypot(p.x,p.z);if(d>WORLD){p.x*=WORLD/d;p.z*=WORLD/d}}
function stepChar(p,dt,mx,mz){ // mx,mz 방향벡터
  const len=Math.hypot(mx,mz);let moving=false;
  if(len>.01){mx/=len;mz/=len;p.x+=mx*p.speed*dt;p.z+=mz*p.speed*dt;const ty=Math.atan2(mx,mz);let df=ty-p.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));p.yaw+=df*Math.min(1,dt*12);moving=true}
  push(p);return moving}
function animChar(p,dt,moving,t){
  const u=p.obj.userData,o=p.obj,h=heightAt(p.x,p.z);o.position.set(p.x,h,p.z);o.rotation.y=p.yaw;
  let ph=p.ph||0;if(moving)ph+=dt*(p.speed*1.7);p.ph=ph;const sw=moving?Math.sin(ph)*.7:0;
  u.legL.rotation.x=sw;u.legR.rotation.x=-sw;u.armL.rotation.x=-sw*.8;u.armR.rotation.x=sw*.8;
  u.body.position.y=moving?Math.abs(Math.sin(ph))*.12:0;u.cup.visible=false;
  u.armL.rotation.z=0;u.armR.rotation.z=0;u.body.scale.y=1;
  if(p.sit){u.body.position.y=-.5;u.legL.rotation.x=-1.4;u.legR.rotation.x=-1.4;u.legL.position.y=.5;u.legR.position.y=.5;u.legL.position.z=.35;u.legR.position.z=.35}
  else{u.legL.position.y=.28;u.legR.position.y=.28;u.legL.position.z=0;u.legR.position.z=0}
  if(p.act){p.actT-=dt;if(p.act==='wave'){u.armR.rotation.z=-2.5+Math.sin(t*14)*.35;u.armR.rotation.x=0}
    if(p.act==='tea'){u.armR.rotation.x=-1.9+Math.sin(t*2)*.08;u.cup.visible=true;if(Math.random()<.35&&p===me)steam(p.x+Math.sin(p.yaw)*.6,h+2.1,p.z+Math.cos(p.yaw)*.6)}
    if(p.act==='lantern'){u.armL.rotation.z=2.4;u.armR.rotation.z=-2.4}
    if(p.actT<=0)p.act=null}}

/* ---------- 연기·등불 ---------- */
const steams=[];const stGeo=new THREE.SphereGeometry(.07,6,6);
function steam(x,y,z){const m=new THREE.Mesh(stGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7}));m.position.set(x,y,z);scene.add(m);steams.push({m,t:0})}
const floaters=[];let myLanterns=0;try{myLanterns=FINAL?parseInt(localStorage.getItem('moon_lan')||'0',10):0}catch(e){}
function release(x,z,mine){const g=lantern(x,2.6,z,PICK([0xff9a3c,0xffd45a,0xff7a8a,0x8ad4ff]),false);floaters.push({g,t:0,vx:R(-.3,.3),vz:R(-.3,.3)});if(floaters.length>40){const o=floaters.shift();scene.remove(o.g)}}

/* ---------- 소리 ---------- */
let AC=null,master=null,snd=true,ambient=null;
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);startAmbient()}catch(e){}return AC}
function noiseBuf(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function startAmbient(){if(STAGE<5)return;const s=AC.createBufferSource();s.buffer=noiseBuf(4);s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=AC.createGain();g.gain.value=.09;s.connect(f);f.connect(g);g.connect(master);s.start();ambient=g;
  const lfo=AC.createOscillator();lfo.frequency.value=.12;const lg=AC.createGain();lg.gain.value=.04;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  setInterval(()=>{if(snd&&Math.random()<.6)chime(PICK([880,988,1175,1318]),.05,2.6)},4200)}
function chime(f,v=.2,len=1.8){if(!AC||!snd)return;const t=AC.currentTime;for(const [m,a] of [[1,1],[2.01,.35],[3.2,.15]]){const o=AC.createOscillator();o.type='sine';o.frequency.value=f*m;const g=AC.createGain();g.gain.setValueAtTime(v*a,t);g.gain.exponentialRampToValueAtTime(.0005,t+len);o.connect(g);g.connect(master);o.start(t);o.stop(t+len)}}
function pour(){if(!AC||!snd)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf(1.6);const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2400,t+1.4);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+.2);g.gain.linearRampToValueAtTime(.0001,t+1.5);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1.6)}
function step(){if(!AC||!snd)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf(.1);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const g=AC.createGain();g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
$('#bSnd').onclick=()=>{audio();snd=!snd;if(master)master.gain.value=snd?.8:0;$('#bSnd').textContent=snd?'🔊 소리':'🔇 소리'};
if(STAGE<5)$('#bSnd').style.display='none';

/* ---------- 조작 ---------- */
let camYaw=0,camPitch=.42,camDist=17,camDistT=17;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==' '){e.preventDefault()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),gp=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const mark=add(new THREE.RingGeometry(.5,.7,24),new THREE.MeshBasicMaterial({color:0x13ff6a,transparent:true,opacity:.9,side:THREE.DoubleSide}),0,.12,0);mark.rotation.x=-Math.PI/2;mark.visible=false;
function goTo(x,z){const d=Math.hypot(x,z);if(d>WORLD){x*=WORLD/d;z*=WORLD/d}me.tx=x;me.tz=z;me.sit=false;me.act=null;mark.position.set(x,.12,z);mark.visible=true;hideHint()}
function groundHit(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const p=new THREE.Vector3();return ray.ray.intersectPlane(gp,p)?p:null}
let drag=null;const pts=new Map();let pinch0=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:0};else if(pts.size===2){const a=[...pts.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=null}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);camDistT=Math.min(34,Math.max(6,camDistT*pinch0/d));pinch0=d;return}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;
  if(STAGE>=2&&drag.moved>6){camYaw-=dx*.006;camPitch=Math.min(1.25,Math.max(.12,camPitch+dy*.005))}});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(drag&&drag.moved<8&&performance.now()-drag.t<500){audio();const p=groundHit(drag.sx,drag.sy);if(p)goTo(p.x,p.z)}if(pts.size<2)drag=null});
cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);drag=null});
cv.addEventListener('wheel',e=>{if(STAGE<2)return;e.preventDefault();camDistT=Math.min(34,Math.max(6,camDistT*(1+Math.sign(e.deltaY)*.1)))},{passive:false});
let hintT=setTimeout(()=>hideHint(),12000);function hideHint(){$('#hint').style.opacity=0}
if(STAGE<2)$('#hint').textContent='바닥을 눌러 걸어요';
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,2200)}

/* ---------- 활동 ---------- */
let teaCount=0;
function doAct(a){audio();me.tx=null;mark.visible=false;
  if(a==='wave'){me.act='wave';me.actT=2.2;me.sit=false;toast('안녕하세요! 👋');for(const n of npcs){if(Math.hypot(n.x-me.x,n.z-me.z)<9&&n.act!=='wave'){n.act='wave';n.actT=2}}chime(660,.08,1.2)}
  else if(a==='sit'){me.sit=!me.sit;me.act=null;toast(me.sit?'앉았어요. 아무것도 안 해도 돼요':'일어났어요')}
  else if(a==='tea'){me.sit=false;me.act='tea';me.actT=3.4;teaCount++;toast('차를 마셔요 🍵  ('+teaCount+'잔)');pour();setTimeout(()=>chime(1046,.06,1.6),1600)}
  else if(a==='lantern'){me.sit=false;me.act='lantern';me.actT=1.8;myLanterns++;try{if(FINAL)localStorage.setItem('moon_lan',myLanterns)}catch(e){}release(me.x,me.z,true);toast('등불을 띄웠어요 🏮  (내가 띄운 등불 '+myLanterns+'개)');chime(784,.1,2.4)}}
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>doAct(b.dataset.a));
if(STAGE<4)$('#bar').style.display='none';

/* ---------- 지도 ---------- */
const mp=$('#map'),mx=mp.getContext('2d');const MS=480/(WORLD*2+6);
const w2m=(x,z)=>[240+x*MS,240+z*MS];
function drawMap(){mx.fillStyle='#0f1424';mx.fillRect(0,0,480,480);mx.fillStyle='#34452c';mx.beginPath();mx.arc(240,240,WORLD*MS,0,6.3);mx.fill();
  mx.fillStyle='#6b5a40';mx.beginPath();mx.arc(240,240,(WORLD-2)*MS,0,6.3);mx.fill();
  mx.fillStyle='#1c4e72';let [px,pz]=w2m(POND.x,POND.z);mx.beginPath();mx.arc(px,pz,POND.r*MS,0,6.3);mx.fill();
  mx.fillStyle='#6e717a';let [a,b]=w2m(-1.6,19);mx.fillRect(a,b-(35)*MS,3.2*MS,35*MS);
  mx.fillStyle='#2b2f3a';[a,b]=w2m(PAV.x-PAV.w/2,PAV.z-PAV.d/2);mx.fillRect(a,b,PAV.w*MS,PAV.d*MS);
  mx.fillStyle='#9a9ea6';[a,b]=w2m(TOWER.x,TOWER.z);mx.fillRect(a-8,b-8,16,16);
  mx.fillStyle='#ff8a2a';[a,b]=w2m(FIRE.x,FIRE.z);mx.beginPath();mx.arc(a,b,7,0,6.3);mx.fill();
  mx.fillStyle='#fff';mx.font='800 15px "Malgun Gothic"';mx.textAlign='center';
  for(const [t,x,z] of [['찻집',PAV.x,PAV.z-6],['연못',POND.x,POND.z],['돌탑',TOWER.x,TOWER.z+3.5],['모닥불',FIRE.x,FIRE.z+3.5]]){const [q,w]=w2m(x,z);mx.fillText(t,q,w+5)}
  mx.fillStyle='#fff';for(const n of npcs){const [q,w]=w2m(n.x,n.z);mx.beginPath();mx.arc(q,w,4,0,6.3);mx.fill()}
  mx.fillStyle='#13ff6a';[a,b]=w2m(me.x,me.z);mx.beginPath();mx.arc(a,b,8,0,6.3);mx.fill();mx.strokeStyle='#000';mx.lineWidth=2;mx.stroke()}
function openMap(){drawMap();$('#modal').classList.add('show')}
$('#bMap').onclick=openMap;$('#close').onclick=()=>$('#modal').classList.remove('show');
mp.addEventListener('click',e=>{const r=mp.getBoundingClientRect(),k=480/r.width,x=((e.clientX-r.left)*k-240)/MS,z=((e.clientY-r.top)*k-240)/MS;$('#modal').classList.remove('show');goTo(x,z)});
if(STAGE<6)$('#bMap').style.display='none';
window.__moon={me,npcs,goTo,doAct,openMap,camera,set:(y,p,d)=>{camYaw=y;camPitch=p;camDist=camDistT=d}};

/* ---------- NPC 두뇌 ---------- */
function npcThink(n,dt){
  if(n.act||n.sit&&n.wait>0){n.wait-=dt;if(n.wait<=0)n.sit=false;return}
  if(n.tx!=null)return;
  n.wait-=dt;if(n.wait>0)return;
  const r=Math.random();
  if(r<.12){n.act='wave';n.actT=2}
  else if(r<.2){n.act='tea';n.actT=3}
  else if(r<.28){n.sit=true;n.wait=R(5,10);return}
  else if(r<.36&&me.tx==null&&Math.hypot(n.x-me.x,n.z-me.z)<28){ // 줄 서기: 내 뒤로
    const k=npcs.filter(o=>o.queue).length;n.queue=true;const bx=Math.sin(me.yaw+Math.PI),bz=Math.cos(me.yaw+Math.PI);n.tx=me.x+bx*(1.9+k*1.5);n.tz=me.z+bz*(1.9+k*1.5);n.wait=R(8,14);return}
  else{const spots=[[PAV.x+R(-4,4),PAV.z+R(-1,2.5)],[FIRE.x+R(-4,4),FIRE.z+R(-4,4)],[POND.x+R(-8,8),POND.z+R(-8,8)],[R(-12,12),R(-8,20)],[TOWER.x+R(-4,4),TOWER.z+R(-4,5)]];const s=PICK(spots);n.tx=s[0];n.tz=s[1]}
  n.wait=R(2,6)}

/* ---------- 루프 ---------- */
let last=performance.now(),tm=0,stepT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
  // 나
  let mx2=0,mz2=0;const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
  let key=false;if(keys.w||keys.arrowup){mx2+=fx;mz2+=fz;key=true}if(keys.s||keys.arrowdown){mx2-=fx;mz2-=fz;key=true}if(keys.d||keys.arrowright){mx2+=rx;mz2+=rz;key=true}if(keys.a||keys.arrowleft){mx2-=rx;mz2-=rz;key=true}
  if(key){me.tx=null;mark.visible=false;me.sit=false;me.act=null;hideHint()}
  else if(me.tx!=null){const dx=me.tx-me.x,dz=me.tz-me.z,d=Math.hypot(dx,dz);if(d<.3){me.tx=null;mark.visible=false}else{mx2=dx;mz2=dz}}
  if(me.sit||me.act==='tea'||me.act==='lantern'){mx2=0;mz2=0}
  const mv=stepChar(me,dt,mx2,mz2);if(mv){stepT-=dt;if(stepT<=0){step();stepT=.34}}
  animChar(me,dt,mv,tm);
  // NPC
  for(const n of npcs){npcThink(n,dt);let nx=0,nz=0;if(n.tx!=null&&!n.act&&!n.sit){const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);if(d<.5){n.tx=null;if(n.queue){n.wait=R(8,14);n.yaw=me.yaw}}else{nx=dx;nz=dz}}
    if(n.queue&&n.tx==null){n.wait-=dt*0;if(Math.hypot(n.x-me.x,n.z-me.z)>30)n.queue=false;if(me.tx!=null){n.queue=false}}
    const m2=stepChar(n,dt,nx,nz);
    for(const o of [me,...npcs]){if(o===n)continue;const ddx=n.x-o.x,ddz=n.z-o.z,dd=Math.hypot(ddx,ddz);if(dd<1.1&&dd>1e-3){n.x+=ddx/dd*(1.1-dd)*.5;n.z+=ddz/dd*(1.1-dd)*.5}}
    animChar(n,dt,m2,tm)}
  for(const o of [me,...npcs]){const tg=o.obj.userData.tag,dd=camera.position.distanceTo(o.obj.position),k=Math.min(1.25,Math.max(.6,dd/17));tg.scale.set(3.0*k,.75*k,1)}
  // 연기·등불
  for(let i=steams.length-1;i>=0;i--){const s=steams[i];s.t+=dt;s.m.position.y+=dt*.9;s.m.material.opacity=Math.max(0,.7-s.t*.7);if(s.t>1){scene.remove(s.m);steams.splice(i,1)}}
  for(const f of floaters){f.t+=dt;f.g.position.y+=dt*(.9+f.t*.03);f.g.position.x+=f.vx*dt;f.g.position.z+=f.vz*dt}
  // 낙엽
  if(leaves){for(let i=0;i<LN;i++){lpos[i*3+1]-=lvel[i*2+1]*dt;lpos[i*3]+=Math.sin(tm+i)*lvel[i*2]*dt;if(lpos[i*3+1]<0){lpos[i*3+1]=22;lpos[i*3]=me.x+R(-30,30);lpos[i*3+2]=me.z+R(-30,30)}}leaves.geometry.attributes.position.needsUpdate=true}
  // 불
  flame.scale.y=1+Math.sin(tm*17)*.18+Math.sin(tm*7)*.1;flame.scale.x=flame.scale.z=1+Math.sin(tm*11)*.08;fireLight.intensity=(STAGE>=5?60:15)*(.85+Math.sin(tm*13)*.1+Math.random()*.07);
  mark.rotation.z+=dt;mark.scale.setScalar(1+Math.sin(tm*5)*.08);
  // 카메라
  camDist+=(camDistT-camDist)*Math.min(1,dt*8);
  const cx=me.x+Math.sin(camYaw)*Math.cos(camPitch)*camDist,cy=heightAt(me.x,me.z)+1.6+Math.sin(camPitch)*camDist,cz=me.z+Math.cos(camYaw)*Math.cos(camPitch)*camDist;
  camera.position.set(cx,cy,cz);camera.lookAt(me.x,heightAt(me.x,me.z)+1.7,me.z);
  renderer.render(scene,camera)}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
requestAnimationFrame(loop);
setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),900)},700);
</script>
</body>
</html>
